
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - DEV@Deakin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">DEV@Deakin</a>
    <a href="post.html">Post</a>
    <a href="login.html">Login</a>
  </nav>

  <div class="auth-box">
    <h2>Sign Up</h2>
    <form id="signupForm">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Email</label>
      <input type="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" minlength="6" placeholder="Enter your password" required>

      <label>Confirm Password</label>
      <input type="password" minlength="6" placeholder="Confirm your password" required>

      <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account?</p>
    <a href="login.html">Login</a>
  </div>
</body>
</html>
